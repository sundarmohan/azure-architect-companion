name: MonitorAI EC2 post-deployment verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify the deployed login and workspaces in Chromium
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$work/key"
          unset EC2_SSH_PRIVATE_KEY
          ssh_opts=(-i "$work/key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$work/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_opts[@]}" "$EC2_USER@$EC2_HOST" 'grep -E "^MONITORAI_BOOTSTRAP_(USERNAME|PASSWORD)=" ~/monitorai-v22/.env' > "$work/bootstrap"
          ssh "${ssh_opts[@]}" -fNT -o ExitOnForwardFailure=yes -L 8003:127.0.0.1:8003 "$EC2_USER@$EC2_HOST"
          cd "$work"
          npm install --no-audit --no-fund --no-save playwright-core@1.56.1
          cp "$GITHUB_WORKSPACE/deploy/browser-smoke.cjs" .
          node browser-smoke.cjs
      - name: Retire the verified dedicated Phase 5 preview
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            project=monitorai-v22-preview
            volume=monitorai-v22-preview_monitorai_pg_data
            image=ghcr.io/sundarmohan/azure-architect-companion:preview-5ee4f5a1ca29cb5c69a14a19cb52de55c092959c
            app=$(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter label=com.docker.compose.service=app)
            db=$(docker ps -aq --filter "label=com.docker.compose.project=$project" --filter label=com.docker.compose.service=postgres)
            if [ -z "$app$db" ] && ! docker volume inspect "$volume" >/dev/null 2>&1; then
              echo "Dedicated preview already absent"
              exit 0
            fi
            test -n "$app" && test -n "$db" || { echo "Preview ownership incomplete"; exit 1; }
            for id in "$app" "$db"; do
              test "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id")" = "$HOME/$project"
            done
            test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$image"
            test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$db")" = "$volume"
            test "$(docker volume inspect --format '{{index .Labels "com.docker.compose.project"}}' "$volume")" = "$project"
            test "$(docker ps -aq --filter "volume=$volume")" = "$db"
            docker stop "$app" "$db"
            docker rm "$app" "$db"
            docker volume rm "$volume"
            image_id=$(docker image inspect --format '{{.Id}}' "$image")
            if [ -z "$(docker ps -aq --filter "ancestor=$image_id")" ]; then
              docker image rm "$image"
            fi
            curl -fsS http://127.0.0.1:8003/health
            echo "Dedicated preview containers and database volume retired"
      - name: Verify restart and isolated storage on the deployed EC2 stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            cd ~/monitorai-v22
            export COMPOSE_PROJECT_NAME=monitorai-v22
            app=$(docker compose ps -q app)
            db=$(docker compose ps -q postgres)
            image=ghcr.io/sundarmohan/azure-architect-companion:ba6e0daa0c60f41081babe14e76271199d296d44
            test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "$image"
            mount=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$db")
            test "$mount" = monitorai-v22_monitorai_pg_data
            legacy=$(docker ps --filter label=com.docker.compose.project=azure-architect-companion --filter label=com.docker.compose.service=app -q)
            for id in "$app" "$db"; do
              test "$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "$id")" = unless-stopped
            done
            docker restart "$db" >/dev/null
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$db")" = healthy ]; then break; fi
              sleep 2
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$db")" = healthy
            docker restart "$app" >/dev/null
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy ]; then break; fi
              sleep 2
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
            curl -fsS http://127.0.0.1:8003/health
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8003/api/auth/me)" = 401
            docker compose exec -T app alembic current | grep -Fx '0020_assessment_records (head)'
            if docker logs --since 15m "$app" 2>&1 | grep -qiE '(^|[[:space:]])(ERROR|Traceback)(:|[[:space:]])'; then
              echo "Application logged an error within the verification window"
              exit 1
            fi
            if [ -n "$legacy" ]; then test "$(docker inspect --format '{{.State.Running}}' "$legacy")" = true; fi
            echo "App and database restarted healthy; protected API and Alembic checks passed."
