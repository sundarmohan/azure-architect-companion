name: CI/CD - Build and Deploy

on:
  push:
    branches:
      - main
  # Pull requests run the test jobs only; build and deploy are gated to main.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/sundarmohan/azure-architect-companion

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  backend-test:
    name: test
    runs-on: ubuntu-latest

    # The app's startup hook runs Alembic migrations, so route tests need a real
    # PostgreSQL. This is a throwaway CI-only database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitorai
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: monitorai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitorai -d monitorai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://monitorai:ci_only_password@localhost:5432/monitorai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      - name: Run pytest
        working-directory: backend
        run: |
          pytest -v --tb=short

      - name: Verify Alembic migration chain
        working-directory: backend
        run: |
          alembic heads
          alembic history | head -20

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry: authenticates with the workflow's own
      # GITHUB_TOKEN, so no extra registry secrets are required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate EC2 configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing EC2_USER"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Missing EC2_SSH_PRIVATE_KEY"; exit 1; }

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/deploy.sh"
          target: "/home/${{ secrets.EC2_USER }}/azure-architect-companion"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,DOCKER_IMAGE,IMAGE_TAG
          script: |
            set -e
            cd ~/azure-architect-companion
            # Short-lived job token: log in only for this pull, then log out
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export IMAGE_TAG DOCKER_IMAGE
            bash deploy/deploy.sh

            docker compose ps
            docker compose exec -T app alembic current

            # End-to-end smoke checks against the running container
            curl --fail --show-error --silent http://localhost:8001/health
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/api/architectures
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/api/azure/resource-catalog
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/api/settings
            docker compose logs --tail=100 app

      - name: Verify public accessibility
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for path in health api/architectures ""; do
            code=$(curl -s -m 15 -o /dev/null -w "%{http_code}" "http://$EC2_HOST:8001/$path" || true)
            echo "::notice title=Public check::GET :8001/$path -> HTTP $code"
          done
