name: MonitorAI Phase 3 private EC2 preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitorai-v22-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.ref == 'refs/heads/release/v2.2-phase3-ec2'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sundarmohan/azure-architect-companion:preview-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-preview:
    needs: publish-preview
    if: github.ref == 'refs/heads/release/v2.2-phase3-ec2'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Copy private preview Compose configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: "/home/${{ secrets.EC2_USER }}/monitorai-v22-preview"
      - name: Start private preview and verify access
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: preview-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 10m
          script: |
            set -eu
            cd ~/monitorai-v22-preview
            umask 077
            if [ ! -e .env ]; then
              db_password=$(openssl rand -hex 32)
              admin_password=$(openssl rand -hex 24)
              azure_key=$(openssl rand -base64 32 | tr '+/' '-_')
              {
                printf 'POSTGRES_PASSWORD=%s\n' "$db_password"
                printf 'MONITORAI_BOOTSTRAP_USERNAME=monitorai-admin\n'
                printf 'MONITORAI_BOOTSTRAP_PASSWORD=%s\n' "$admin_password"
                printf 'MONITORAI_AZURE_ENCRYPTION_KEY=%s\n' "$azure_key"
              } > .env.new
              mv .env.new .env
              unset db_password admin_password azure_key
            fi
            chmod 600 .env
            export IMAGE_TAG
            export COMPOSE_PROJECT_NAME=monitorai-v22-preview
            legacy=$(docker ps --filter label=com.docker.compose.project=azure-architect-companion --filter label=com.docker.compose.service=app -q)
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull
            docker compose up -d --wait --wait-timeout 180
            curl -fsS http://127.0.0.1:8002/health
            curl -fsS -o /dev/null http://127.0.0.1:8002/
            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/api/architectures)" = 401
            docker compose exec -T app alembic current
            test "$(docker compose port app 8000)" = 127.0.0.1:8002
            postgres=$(docker compose ps -q postgres)
            volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres")
            test "$volume" = monitorai-v22-preview_monitorai_pg_data
            if test -n "$legacy"; then
              test "$(docker inspect --format '{{.State.Running}}' "$legacy")" = true
            fi
            docker compose exec -T app python -c 'import json, os, urllib.request; payload = json.dumps({"username": os.environ["MONITORAI_BOOTSTRAP_USERNAME"], "password": os.environ["MONITORAI_BOOTSTRAP_PASSWORD"]}).encode(); req = urllib.request.Request("http://127.0.0.1:8000/api/auth/login", data=payload, headers={"Content-Type": "application/json", "X-MonitorAI-Request": "1"}); response = urllib.request.urlopen(req); assert response.status == 200 and "Secure" in response.headers["Set-Cookie"]; print("Bootstrap sign-in: passed")'
            echo "Preview healthy on loopback port 8002 with separate PostgreSQL storage."
