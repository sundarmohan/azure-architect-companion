name: MonitorAI public ingress preflight
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            for port in 80 443 8003; do
              echo "Local TCP port $port:"
              ss -ltnpH "sport = :$port" | awk '{print $4, $6}'
            done
            for binary in nginx caddy; do
              if command -v "$binary" >/dev/null; then echo "$binary installed"; fi
              if systemctl is-active --quiet "$binary"; then echo "$binary active"; fi
            done
            if sudo -n true 2>/dev/null; then echo "Non-interactive sudo available"; fi
            if command -v aws >/dev/null; then echo "AWS CLI available on EC2"; fi
            echo "Container port bindings (images and ports only)"
            docker ps --format '{{.Image}} {{.Ports}}'
            curl -fsS http://127.0.0.1:8003/health
      - name: Check existing public transport
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          for scheme in http https; do
            echo "$scheme status $(curl --max-time 8 -s -o /dev/null -w '%{http_code}' "$scheme://$HOST/" || true)"
          done
