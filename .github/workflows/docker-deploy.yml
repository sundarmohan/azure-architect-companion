name: MonitorAI EC2 readiness check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check host configuration without changing the running service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd ~/azure-architect-companion
            for key in POSTGRES_PASSWORD MONITORAI_BOOTSTRAP_USERNAME MONITORAI_BOOTSTRAP_PASSWORD MONITORAI_AZURE_ENCRYPTION_KEY; do
              if test -f .env && grep -qE "^$key=[^[:space:]]" .env; then
                echo "runtime $key: configured"
              else
                echo "runtime $key: missing"
              fi
            done
            postgres=$(docker ps --filter label=com.docker.compose.project=azure-architect-companion --filter label=com.docker.compose.service=postgres --format '{{.ID}}' | head -1)
            if test -n "$postgres"; then
              volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres")
              case "$volume" in
                *_postgres_data) echo "running database: legacy Compose volume" ;;
                *_monitorai_pg_data) echo "running database: independent V2.2 Compose volume" ;;
                *) echo "running database: unexpected datastore" ;;
              esac
            else
              echo "running database: service not detected"
            fi
            if docker volume inspect azure-architect-companion_monitorai_pg_data >/dev/null 2>&1; then
              echo "V2.2 Compose volume: already exists"
            else
              echo "V2.2 Compose volume: absent"
            fi
            if ss -ltnH '( sport = :443 )' | head -1 | grep -q .; then
              echo "local TLS listener: present"
            else
              echo "local TLS listener: absent"
            fi
      - name: Check existing TLS endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if curl --fail --silent --max-time 10 --output /dev/null "https://$EC2_HOST/health"; then
            echo "trusted HTTPS health on configured host: reachable"
          else
            echo "trusted HTTPS health on configured host: unverified"
          fi
