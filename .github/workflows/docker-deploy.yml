name: Provision MonitorAI HTTPS ingress
on: workflow_dispatch
jobs:
  ingress:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: deploy/configure-ingress.sh
          target: "/home/${{ secrets.EC2_USER }}/monitorai-v22"
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            token=$(curl -fsS --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
            address=$(curl -fsS --max-time 5 -H "X-aws-ec2-metadata-token: $token" http://169.254.169.254/latest/meta-data/public-ipv4)
            test "$address" = 98.130.117.140
            export MONITORAI_PUBLIC_HOST="$address"
            cd ~/monitorai-v22
            bash deploy/configure-ingress.sh
      - name: Verify certificate and health externally
        run: |
          for attempt in $(seq 1 2); do
            if curl -fsS --max-time 5 https://98.130.117.140/health; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Check certificate issuance status
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker logs --since 12m rca-ingress-caddy-1 2>&1 | python3 -c 'import json,sys
            for line in sys.stdin:
                try: entry=json.loads(line)
                except ValueError: continue
                if "98.130.117.140" in line and "tls" in entry.get("logger",""):
                    print(entry.get("logger"), entry.get("msg"), entry.get("error",""))'
            echo | timeout 8 openssl s_client -connect 127.0.0.1:443 -servername 98.130.117.140 2>/dev/null | openssl x509 -noout -issuer -ext subjectAltName || true
