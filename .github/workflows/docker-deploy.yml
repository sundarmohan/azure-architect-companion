name: MonitorAI Phase 5 private EC2 preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitorai-v22-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.ref == 'refs/heads/release/v2.2-phase5-ec2'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sundarmohan/azure-architect-companion:preview-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-preview:
    needs: publish-preview
    if: github.ref == 'refs/heads/release/v2.2-phase5-ec2'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - name: Back up and upgrade the existing private preview
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: preview-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 12m
          script: |
            set -eu
            cd ~/monitorai-v22-preview
            umask 077
            test -f .env
            test -f docker-compose.yml
            export COMPOSE_PROJECT_NAME=monitorai-v22-preview
            export IMAGE_TAG
            test "$(docker compose port app 8000)" = 127.0.0.1:8002
            postgres=$(docker compose ps -q postgres)
            legacy=$(docker ps --filter label=com.docker.compose.project=azure-architect-companion --filter label=com.docker.compose.service=app -q)
            test -n "$postgres"
            mount=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres")
            test "$mount" = monitorai-v22-preview_monitorai_pg_data
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker compose pull app
            previous=$(docker compose ps -q app)
            mkdir -p backups
            snapshot_dir=$(mktemp -d backups/phase5-XXXXXXXX)
            docker inspect --format '{{.Config.Image}}' "$previous" > "$snapshot_dir/previous-image.txt"
            cp docker-compose.yml "$snapshot_dir/docker-compose.yml"
            docker compose exec -T postgres sh -c 'pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$snapshot_dir/postgres.dump"
            test -s "$snapshot_dir/postgres.dump"
            docker compose exec -T postgres pg_restore --list < "$snapshot_dir/postgres.dump" >/dev/null
            echo "Existing preview database backup verified."
            docker compose up -d --no-deps --wait --wait-timeout 180 app
            curl -fsS http://127.0.0.1:8002/health
            curl -fsS -o /dev/null http://127.0.0.1:8002/
            for path in api/architectures api/azure/security api/assessments; do
              test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8002/$path")" = 401
            done
            docker compose exec -T app alembic current | grep -F '0020_assessment_records (head)'
            test "$(docker compose port app 8000)" = 127.0.0.1:8002
            test "$(docker compose ps -q postgres)" = "$postgres"
            app=$(docker compose ps -q app)
            test "$(docker inspect --format '{{.Config.Image}}' "$app")" = "ghcr.io/sundarmohan/azure-architect-companion:$IMAGE_TAG"
            if test -n "$legacy"; then
              test "$(docker inspect --format '{{.State.Running}}' "$legacy")" = true
            fi
            echo "Phase 5 private preview healthy with its original database and loopback binding."
