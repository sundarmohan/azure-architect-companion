name: Verify public MonitorAI independently
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Dev
    env:
      MONITORAI_PUBLIC_URL: ${{ vars.MONITORAI_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Open public MonitorAI in Chromium
        run: |
          set -eu
          work=$(mktemp -d)
          cp deploy/browser-smoke.cjs "$work/"
          cd "$work"
          npm install --no-audit --no-fund --no-save playwright-core@1.56.1
          node --unhandled-rejections=strict browser-smoke.cjs
      - uses: appleboy/ssh-action@v1
        if: always()
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/monitorai-v22
            export COMPOSE_PROJECT_NAME=monitorai-v22
            app=$(docker compose ps -q app)
            db=$(docker compose ps -q postgres)
            echo "App and database present: $(test -n "$app" && test -n "$db" && echo yes)"
            echo "Database health: $(docker inspect --format '{{.State.Health.Status}}' "$db")"
            echo "Database volume: $(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$db")"
            echo "Database Compose port result: $(docker compose port postgres 5432 2>/dev/null || true)"
            echo "Database published port count: $(docker inspect --format '{{len .HostConfig.PortBindings}}' "$db")"
            echo "App port: $(docker compose port app 8000)"
