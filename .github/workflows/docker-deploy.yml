name: CI/CD - Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: azure_architect
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/azure_architect
        run: |
          pytest -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment script to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/deploy.sh,.env.example"
          target: "/home/${{ secrets.EC2_USER }}/azure-architect-companion"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd ~/azure-architect-companion
            export IMAGE_TAG="${{ github.sha }}"
            bash deploy/deploy.sh
            
            # Health check
            echo "Waiting for application to be ready..."
            sleep 10
            HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health)
            if [ "$HEALTH_CHECK" = "200" ]; then
              echo "✓ Application health check passed"
              exit 0
            else
              echo "✗ Application health check failed (HTTP $HEALTH_CHECK)"
              docker compose logs app
              exit 1
            fi
