name: CI/CD - Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  backend-test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      - name: Run pytest
        working-directory: backend
        run: |
          pytest -v --tb=short

      - name: Verify Alembic migration chain
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./alembic_check.db
        run: |
          alembic heads
          alembic history | head -20

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN"; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate EC2 configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing EC2_USER"; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Missing EC2_SSH_PRIVATE_KEY"; exit 1; }

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/deploy.sh"
          target: "/home/${{ secrets.EC2_USER }}/azure-architect-companion"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/azure-architect-companion
            export IMAGE_TAG="${{ github.sha }}"
            export DOCKER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/azure-architect-companion"
            bash deploy/deploy.sh

            docker compose ps
            docker compose exec -T app alembic current
            docker compose exec -T app python -c "from app.models import Relationship, ResourceCatalog; assert hasattr(Relationship, 'relationship_metadata'); assert hasattr(ResourceCatalog, 'resource_metadata'); print('Models imported successfully')"

            # End-to-end smoke checks against the running container
            curl --fail --show-error --silent http://localhost:8001/health
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/api/architectures
            curl --fail --show-error --silent -o /dev/null http://localhost:8001/api/catalog/resources
            docker compose logs --tail=100 app

      - name: Verify public accessibility
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for path in health api/architectures ""; do
            code=$(curl -s -m 15 -o /dev/null -w "%{http_code}" "http://$EC2_HOST:8001/$path" || true)
            echo "::notice title=Public check::GET :8001/$path -> HTTP $code"
          done
