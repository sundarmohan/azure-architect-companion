# Production / EC2 stack for MonitorAI V2.2 (deployed by .github/workflows/docker-deploy.yml).
# Local development uses docker-compose.dev-db.yml + scripts/start-unified-dev.ps1 instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitorai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-monitorai}
    volumes:
      # New volume: the previous Azure Architect Companion volume (postgres_data)
      # is left untouched so its data stays available for rollback.
      - monitorai_pg_data:/var/lib/postgresql/data
    # No host port: the app reaches Postgres over app-network, and the EC2 host
    # already has a service on 5432. Use `docker compose exec postgres psql` for access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitorai} -d ${POSTGRES_DB:-monitorai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/sundarmohan/azure-architect-companion}:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MONITORAI_BOOTSTRAP_USERNAME: ${MONITORAI_BOOTSTRAP_USERNAME:-}
      MONITORAI_BOOTSTRAP_PASSWORD: ${MONITORAI_BOOTSTRAP_PASSWORD:-}
      MONITORAI_AZURE_ENCRYPTION_KEY: ${MONITORAI_AZURE_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitorai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monitorai}
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  monitorai_pg_data:
    driver: local

networks:
  app-network:
    driver: bridge
