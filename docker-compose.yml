services:
  postgres:
    image: postgres:15-alpine
    container_name: azure-architect-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-azure_architect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port: the app reaches Postgres over app-network, and the EC2 host
    # already has a service on 5432. Use `docker compose exec postgres psql` for access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-azure_architect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/sundarmohan/azure-architect-companion}:${IMAGE_TAG:-latest}
    container_name: azure-architect-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Always connect to the compose postgres service (localhost inside the
      # container is the app container itself, not the database).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-azure_architect}
      APP_NAME: ${APP_NAME:-Azure Architect Companion}
      DEBUG: ${DEBUG:-False}
    ports:
      - "${APP_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
